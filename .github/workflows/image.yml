name: Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image.yml'
      - 'Dockerfile'
  pull_request:
    paths:
      - '.github/workflows/image.yml'
      - 'Dockerfile'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag langrisha/keybase .

      - name: Check client
        run: docker run --rm langrisha/keybase keybase status
