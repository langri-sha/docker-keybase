ignore = [
  "**/node_modules",
  "**/dist",
  "**/*.tsbuildinfo",
]

[modules.prettier]
source = "dagger.io/js/prettier"

[modules.prettier.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"

[modules.ci]
source = "github.com/langri-sha/dagger/ci@v2.0.0"

[modules.ci.generate]
skip = ["projen"]

[modules.projen]
source = "github.com/langri-sha/dagger/projen@v2.0.0"

[modules.typescript]
source = "github.com/langri-sha/dagger/typescript@v2.0.0"
